<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animaldle - Daily Animal Guessing Game</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-row">
        <h1>🐾 Animaldle</h1>
        <button id="settingsBtn" class="settings-btn" title="Settings">⚙️</button>
      </div>
      <p class="subtitle">Daily Animal Guessing Game</p>
      <div class="game-number" id="gameNumber"></div>
    </header>

    <main id="gameArea">
      <!-- Silhouette Display -->
      <div class="silhouette-container">
        <div id="silhouette" class="silhouette">
          <!-- SVG silhouette will be inserted here -->
        </div>
      </div>

      <!-- Attribution (shown after game end) -->
      <div id="attribution" class="attribution hidden"></div>

      <!-- Name Blanks -->
      <div class="name-display">
        <div id="nameBlanks" class="name-blanks"></div>
      </div>

      <!-- Score Display -->
      <div class="score-display">
        <span>Potential Score: </span>
        <span id="currentScore" class="score-value">100</span>
      </div>

      <!-- Hint Buttons -->
      <div class="hint-buttons">
        <button id="letterHintBtn" class="hint-btn letter-hint">
          <span class="hint-icon">🔤</span>
          <span class="hint-text">Reveal Letter</span>
          <span class="hint-cost">-10 pts</span>
        </button>
        <button id="attributeHintBtn" class="hint-btn attribute-hint">
          <span class="hint-icon">📊</span>
          <span class="hint-text">Reveal Attribute</span>
          <span class="hint-cost">-5 pts</span>
        </button>
      </div>

      <!-- Revealed Attributes -->
      <div id="revealedAttributes" class="revealed-attributes hidden">
        <h3>Revealed Attributes</h3>
        <div id="attributesList" class="attributes-list"></div>
      </div>

      <!-- Guess Input (free text, no autocomplete) -->
      <div class="guess-input-container">
        <input
          type="text"
          id="guessInput"
          class="guess-input"
          placeholder="Type an animal name..."
          autocomplete="off"
        >
        <button id="submitGuess" class="submit-btn">Guess</button>
      </div>
      <div id="guessMessage" class="guess-message hidden"></div>

      <!-- Guess History -->
      <div class="guess-history">
        <h3>Previous Guesses</h3>
        <div id="guessHistory" class="history-list"></div>
      </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content settings-modal-content">
        <div class="modal-header">
          <h2>⚙️ Settings</h2>
        </div>
        <div class="modal-body">
          <div class="setting-row">
            <div class="setting-label">
              <strong>Difficulty</strong>
              <p class="setting-description">Expert mode includes all ~11,950 organisms</p>
            </div>
            <div class="setting-control">
              <button id="difficultyNormal" class="difficulty-btn active">Normal</button>
              <button id="difficultyExpert" class="difficulty-btn">Expert</button>
            </div>
          </div>
          <button id="closeSettings" class="close-settings-btn">Close</button>
        </div>
      </div>
    </div>

    <!-- Win/Lose Modal -->
    <div id="resultModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle"></h2>
        </div>
        <div class="modal-body">
          <div id="animalReveal" class="animal-reveal"></div>

          <!-- Taxonomy Tree -->
          <div id="taxonomyTree" class="taxonomy-tree hidden"></div>

          <div class="result-stats">
            <div class="stat">
              <span class="stat-label">Score</span>
              <span id="finalScore" class="stat-value"></span>
            </div>
            <div class="stat">
              <span class="stat-label">Guesses</span>
              <span id="totalGuesses" class="stat-value"></span>
            </div>
          </div>
          <div class="player-stats">
            <h3>Your Stats</h3>
            <div class="stats-grid">
              <div class="stat-box">
                <span class="stat-number" id="gamesPlayed">0</span>
                <span class="stat-label">Played</span>
              </div>
              <div class="stat-box">
                <span class="stat-number" id="winPercent">0%</span>
                <span class="stat-label">Win %</span>
              </div>
              <div class="stat-box">
                <span class="stat-number" id="currentStreak">0</span>
                <span class="stat-label">Streak</span>
              </div>
              <div class="stat-box">
                <span class="stat-number" id="maxStreak">0</span>
                <span class="stat-label">Max</span>
              </div>
            </div>
          </div>
          <div id="shareResult" class="share-result"></div>
          <button id="shareBtn" class="share-btn">
            <span>📋</span> Share Result
          </button>
          <p id="shareConfirm" class="share-confirm hidden">Copied to clipboard!</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/daily.js"></script>
  <script src="js/hints.js"></script>
  <script src="js/sharing.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
